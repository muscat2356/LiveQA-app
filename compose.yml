services:
  backend:
    container_name: Live-qa-backend
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 専用 realm live-qa（client live-qa-app）
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-live-qa-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-live-qa-dev-secret}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      # ブラウザが見る URL（箱の中の token-uri は yml の keycloak:8080 のまま）
      KEYCLOAK_AUTHORIZATION_URI: ${KEYCLOAK_AUTHORIZATION_URI:-http://localhost:8080/realms/live-qa/protocol/openid-connect/auth}
      KEYCLOAK_END_SESSION_URI: ${KEYCLOAK_END_SESSION_URI:-http://localhost:8080/realms/live-qa/protocol/openid-connect/logout}
      LOGIN_SUCCESS_REDIRECT_URI: ${LOGIN_SUCCESS_REDIRECT_URI:-http://localhost:3000/dashboard}
      POST_LOGOUT_REDIRECT_URI: ${POST_LOGOUT_REDIRECT_URI:-http://localhost:3000/}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_healthy

  frontend:
    container_name: Live-qa-frontend
    build: ./frontend
    environment:
      # コンテナ間通信 → サービス名 + コンテナ側ポート
      API_BASE_URL: http://backend:8080
      # ブラウザが踏む URL → localhost + ホスト側ポート
      NEXT_PUBLIC_KEYCLOAK_LOGIN_URL: http://localhost:8081/oauth2/authorization/keycloak
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_NAME: ${KC_DB_NAME}
      KC_DB_USER: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/keycloak/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # realm JSON のプレースホルダを env で埋めてから Keycloak が import する
  keycloak-realm:
    image: alpine:3.21
    environment:
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-live-qa-dev-secret}
      KEYCLOAK_DEV_HOST_PASSWORD: ${KEYCLOAK_DEV_HOST_PASSWORD:-live-qa-dev-host}
    volumes:
      - ./keycloak/live-qa-realm.json:/template.json:ro
      - keycloak_realm_import:/import
    command:
      - /bin/sh
      - -c
      - |
        sed -e "s#__KEYCLOAK_CLIENT_SECRET__#$${KEYCLOAK_CLIENT_SECRET}#g" \
            -e "s#__KEYCLOAK_DEV_HOST_PASSWORD__#$${KEYCLOAK_DEV_HOST_PASSWORD}#g" \
            /template.json > /import/live-qa-realm.json
        if grep -q '__KEYCLOAK_' /import/live-qa-realm.json; then
          echo 'realm JSON のプレースホルダが残っている' >&2
          exit 1
        fi
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # ブラウザは KC_HOSTNAME、コンテナ間は keycloak:8080（フル URL 必須）
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    # Keycloak 26 の /health/ready は "status": "UP"（大文字）。小文字 up だと永遠に unhealthy → backend が Waiting のまま
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    volumes:
      # 埋め済み JSON（テンプレを直接マウントしない）
      - keycloak_realm_import:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-realm:
        condition: service_completed_successfully

volumes:
  postgres_data:
  keycloak_realm_import:
