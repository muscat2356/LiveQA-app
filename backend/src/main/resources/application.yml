# live-qa-app backend（F-01 骨組み）
# Keycloak / Redis は環境に合わせて変更。秘密は .env 等で渡す

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
# ログアウト後のブラウザ戻り先（フロント）。Keycloak Valid post logout redirect URIs と一致させる
app:
  login:
    success-redirect-uri: ${LOGIN_SUCCESS_REDIRECT_URI:http://localhost:3000/dashboard}
  logout:
    post-logout-redirect-uri: ${POST_LOGOUT_REDIRECT_URI:http://localhost:3000/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  keycloak:
    admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
      realm: ${KEYCLOAK_REALM:live-qa}
      username: ${KEYCLOAK_ADMIN:admin}
      password: ${KEYCLOAK_ADMIN_PASSWORD:}
      client-id: ${KEYCLOAK_CLIENT_ID:live-qa-app}
      redirect-uri: ${KEYCLOAK_ACTIONS_REDIRECT_URI:http://localhost:3000/}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
spring:
  application:
    name: live-qa-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:live_qa}
    username: ${POSTGRES_USER:live_qa_user}
    password: ${POSTGRES_PASSWORD:live_qa_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis
    redis:
      namespace: live-qa
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:live-qa-app}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:live-qa-dev-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
logging:
  level:
    org.springframework.security: INFO
---
# ホスト起動（mvn spring-boot:run）用。Compose の backend は profile=docker のためこの文書は読まない
spring:
  config:
    activate:
      on-profile: "!docker"
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/live-qa}
