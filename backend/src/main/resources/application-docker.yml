# Compose 内の backend 用（コンテナから Keycloak は hostname "keycloak"）
# realm は live-qa（専用。LibraShare 相乗りはやめる）
# ブラウザ向け認可 URL は localhost、トークン／JWK は Docker ネットワーク名を使う

spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            # issuer-uri は使わない（localhost だとコンテナ内で Connection refused）
            authorization-uri: http://localhost:8080/realms/live-qa/protocol/openid-connect/auth
            token-uri: http://keycloak:8080/realms/live-qa/protocol/openid-connect/token
            jwk-set-uri: http://keycloak:8080/realms/live-qa/protocol/openid-connect/certs
            user-info-uri: http://keycloak:8080/realms/live-qa/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

app:
  keycloak:
    admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://keycloak:8080}
